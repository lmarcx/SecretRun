table:
  name: reports
  schema: public
object_relationships:
  - name: reporter
    using:
      foreign_key_constraint_on: reporter_user_id
  - name: target
    using:
      foreign_key_constraint_on: target_user_id
  - name: event
    using:
      foreign_key_constraint_on: event_id
array_relationships:
  - name: sanctions
    using:
      foreign_key_constraint_on:
        column: report_id
        table:
          name: sanctions
          schema: public
select_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        reporter_user_id:
          _eq: X-Hasura-User-Id
      set:
        reporter_user_id: X-Hasura-User-Id
      columns: [reporter_user_id, target_user_id, event_id, reason, status]
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
