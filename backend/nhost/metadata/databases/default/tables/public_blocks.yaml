table:
  name: blocks
  schema: public
object_relationships:
  - name: blocker
    using:
      foreign_key_constraint_on: blocker_id
  - name: blocked
    using:
      foreign_key_constraint_on: blocked_id
select_permissions:
  - role: user
    permission:
      columns: [id, blocker_id, blocked_id, created_at]
      filter:
        blocker_id:
          _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        blocker_id:
          _eq: X-Hasura-User-Id
      set:
        blocker_id: X-Hasura-User-Id
      columns: [blocked_id]
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        blocker_id:
          _eq: X-Hasura-User-Id
  - role: admin
    permission:
      filter: {}
