table:
  name: activity_likes
  schema: public
object_relationships:
  - name: activity
    using:
      foreign_key_constraint_on: activity_id
  - name: profile
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns: [activity_id, user_id, created_at]
      filter:
        _and:
          - _not:
              activity:
                profile:
                  blocks_out:
                    blocked_id:
                      _eq: X-Hasura-User-Id
          - _not:
              activity:
                profile:
                  blocks_in:
                    blocker_id:
                      _eq: X-Hasura-User-Id
          - _or:
              - activity:
                  user_id:
                    _eq: X-Hasura-User-Id
              - activity:
                  profile:
                    requester_friendships:
                      _and:
                        - addressee_id:
                            _eq: X-Hasura-User-Id
                        - status:
                            _eq: accepted
              - activity:
                  profile:
                    addressee_friendships:
                      _and:
                        - requester_id:
                            _eq: X-Hasura-User-Id
                        - status:
                            _eq: accepted
              - activity:
                  profile:
                    team_memberships:
                      team:
                        members:
                          user_id:
                            _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns: [activity_id, user_id]
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: admin
    permission:
      filter: {}
