table:
  name: leaderboard_user_season
  schema: public
object_relationships:
  - name: season
    using:
      foreign_key_constraint_on: season_id
  - name: profile
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: anonymous
    permission:
      columns: [season_id, user_id, points, rank, updated_at]
      filter: {}
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
  - role: user
    permission:
      columns: [season_id, user_id, points, rank, updated_at]
      filter: {}
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
