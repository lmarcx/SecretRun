table:
  name: activity_trackpoints
  schema: public
object_relationships:
  - name: activity
    using:
      foreign_key_constraint_on: activity_id
select_permissions:
  - role: user
    permission:
      columns: [id, activity_id, point, recorded_at, speed_kmh]
      filter:
        activity:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
