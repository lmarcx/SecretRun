table:
  name: activity_trackpoints
  schema: public
object_relationships:
  - name: activity
    using:
      foreign_key_constraint_on: activity_id
select_permissions:
  - role: user
    permission:
      columns: [id, activity_id, seq, point, recorded_at, speed_kmh, speed_mps]
      filter:
        activity:
          user_id:
            _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
