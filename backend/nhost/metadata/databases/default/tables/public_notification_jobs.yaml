table:
  name: notification_jobs
  schema: public
object_relationships:
  - name: profile
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns: [id, user_id, title, body, data, status, error, reference_key, created_at, sent_at]
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
