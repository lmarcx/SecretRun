table:
  name: wallets
  schema: public
object_relationships:
  - name: profile
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: ledger_entries
    using:
      foreign_key_constraint_on:
        column: wallet_id
        table:
          name: wallet_ledger
          schema: public
select_permissions:
  - role: user
    permission:
      columns: [id, user_id, balance, updated_at]
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
