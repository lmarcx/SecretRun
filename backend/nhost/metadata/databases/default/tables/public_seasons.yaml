table:
  name: seasons
  schema: public
array_relationships:
  - name: user_leaderboard
    using:
      foreign_key_constraint_on:
        column: season_id
        table:
          name: leaderboard_user_season
          schema: public
  - name: team_leaderboard
    using:
      foreign_key_constraint_on:
        column: season_id
        table:
          name: leaderboard_team_season
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns: [id, name, starts_at, ends_at, is_active, created_at]
      filter: {}
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
  - role: user
    permission:
      columns: [id, name, starts_at, ends_at, is_active, created_at]
      filter: {}
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
