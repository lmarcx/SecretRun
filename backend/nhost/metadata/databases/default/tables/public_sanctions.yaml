table:
  name: sanctions
  schema: public
object_relationships:
  - name: profile
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns: [id, user_id, report_id, sanction_type, reason, starts_at, ends_at, created_at]
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
