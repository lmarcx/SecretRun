table:
  name: events
  schema: public
array_relationships:
  - name: participants
    using:
      foreign_key_constraint_on:
        column: event_id
        table:
          name: event_participants
          schema: public
  - name: activities
    using:
      foreign_key_constraint_on:
        column: event_id
        table:
          name: activities
          schema: public
object_relationships:
  - name: team
    using:
      foreign_key_constraint_on: team_id
  - name: creator
    using:
      foreign_key_constraint_on: created_by
  - name: route
    using:
      foreign_key_constraint_on:
        column: event_id
        table:
          name: event_routes
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns: [id, title, description, reveal_at, starts_at, ends_at, start_date, end_date, is_public, start_area_radius_km, max_participants, created_by, created_at]
      filter:
        is_public:
          _eq: true
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
  - role: user
    permission:
      columns: [id, title, description, reveal_at, starts_at, ends_at, start_date, end_date, is_public, start_area_radius_km, max_participants, created_by, created_at]
      filter:
        is_public:
          _eq: true
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
