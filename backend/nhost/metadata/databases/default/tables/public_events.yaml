table:
  name: events
  schema: public
array_relationships:
  - name: participants
    using:
      foreign_key_constraint_on:
        column: event_id
        table:
          name: event_participants
          schema: public
  - name: activities
    using:
      foreign_key_constraint_on:
        column: event_id
        table:
          name: activities
          schema: public
object_relationships:
  - name: route
    using:
      foreign_key_constraint_on:
        column: event_id
        table:
          name: event_routes
          schema: public
