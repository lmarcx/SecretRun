table:
  name: events
  schema: public
array_relationships:
  - name: participants
    using:
      foreign_key_constraint_on:
        column: event_id
        table:
          name: event_participants
          schema: public
select_permissions:
  - role: public
    permission:
      columns:
        [
          id,
          title,
          description,
          reveal_at,
          starts_at,
          ends_at,
          start_area_center,
          start_area_radius_km,
          created_by,
          created_at,
        ]
      filter: {}
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
  - role: user
    permission:
      columns:
        [
          id,
          title,
          description,
          reveal_at,
          starts_at,
          ends_at,
          start_area_center,
          start_area_radius_km,
          created_by,
          created_at,
        ]
      filter: {}
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
