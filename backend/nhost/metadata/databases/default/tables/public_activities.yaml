table:
  name: activities
  schema: public
object_relationships:
  - name: event
    using:
      foreign_key_constraint_on: event_id
  - name: profile
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: likes
    using:
      foreign_key_constraint_on:
        column: activity_id
        table:
          name: activity_likes
          schema: public
  - name: comments
    using:
      foreign_key_constraint_on:
        column: activity_id
        table:
          name: activity_comments
          schema: public
  - name: trackpoints
    using:
      foreign_key_constraint_on:
        column: activity_id
        table:
          name: activity_trackpoints
          schema: public
select_permissions:
  - role: user
    permission:
      columns: [id, event_id, user_id, status, distance_km, duration_seconds, avg_speed_kmh, points, started_at, finished_at, created_at, suspected_vehicle]
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - profile:
              friendships_out:
                friend_user_id:
                  _eq: X-Hasura-User-Id
          - profile:
              friendships_in:
                user_id:
                  _eq: X-Hasura-User-Id
          - profile:
              team_memberships:
                team:
                  members:
                    user_id:
                      _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
