table:
  name: activities
  schema: public
object_relationships:
  - name: event
    using:
      foreign_key_constraint_on: event_id
  - name: profile
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: trackpoints
    using:
      foreign_key_constraint_on:
        column: activity_id
        table:
          name: activity_trackpoints
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        [id, event_id, user_id, status, distance_km, duration_seconds, avg_speed_kmh, points, started_at, finished_at, created_at]
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns: [event_id, distance_km, duration_seconds, avg_speed_kmh, started_at, finished_at]
