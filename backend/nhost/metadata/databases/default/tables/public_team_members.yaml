table:
  name: team_members
  schema: public
object_relationships:
  - name: team
    using:
      foreign_key_constraint_on: team_id
  - name: profile
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns: [team_id, user_id, role, joined_at]
      filter: {}
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
