table:
  name: wallet_ledger
  schema: public
object_relationships:
  - name: wallet
    using:
      foreign_key_constraint_on: wallet_id
select_permissions:
  - role: user
    permission:
      columns: [id, wallet_id, delta, reason, created_at]
      filter:
        wallet:
          user_id:
            _eq: X-Hasura-User-Id
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
