table:
  name: wallet_ledger
  schema: public
object_relationships:
  - name: wallet
    using:
      foreign_key_constraint_on: wallet_id
select_permissions:
  - role: user
    permission:
      columns: [id, wallet_id, delta, reason, transaction_type, reference_key, metadata, created_at]
      filter:
        wallet:
          user_id:
            _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
