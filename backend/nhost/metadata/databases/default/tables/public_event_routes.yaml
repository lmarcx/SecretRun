table:
  name: event_routes
  schema: public
object_relationships:
  - name: event
    using:
      foreign_key_constraint_on: event_id
select_permissions:
  - role: user
    permission:
      columns: [id, event_id, route_polyline, distance_m, duration_sec, revealed, revealed_at, created_at]
      filter:
        _or:
          - revealed:
              _eq: true
          - event:
              participants:
                user_id:
                  _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
