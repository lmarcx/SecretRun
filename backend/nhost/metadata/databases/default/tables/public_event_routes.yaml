table:
  name: event_routes
  schema: public
object_relationships:
  - name: event
    using:
      foreign_key_constraint_on: event_id
select_permissions:
  - role: user
    permission:
      columns: [id, event_id, route_polyline, revealed, revealed_at, created_at]
      filter:
        _and:
          - revealed:
              _eq: true
          - event:
              participants:
                user_id:
                  _eq: X-Hasura-User-Id
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
