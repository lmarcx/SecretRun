table:
  name: runs
  schema: public
object_relationships:
  - name: event
    using:
      foreign_key_constraint_on: event_id
select_permissions:
  - role: user
    permission:
      columns: [id, user_id, event_id, distance, duration, route, created_at]
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - event:
              is_public:
                _eq: true
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns: [event_id, distance, duration, route]
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
