table:
  name: profiles
  schema: public
array_relationships:
  - name: team_memberships
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: team_members
          schema: public
  - name: event_participations
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: event_participants
          schema: public
  - name: activities
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: activities
          schema: public
object_relationships:
  - name: wallet
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: wallets
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - username
        - display_name
        - avatar_url
        - created_at
        - updated_at
      filter:
        id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - display_name
        - avatar_url
      filter:
        id:
          _eq: X-Hasura-User-Id
      check:
        id:
          _eq: X-Hasura-User-Id
