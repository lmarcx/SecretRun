table:
  name: profiles
  schema: public
select_permissions:
  - role: anonymous
    permission:
      columns: [id, username, display_name, avatar_url, created_at, updated_at]
      filter: {}
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
  - role: user
    permission:
      columns: [id, username, display_name, avatar_url, created_at, updated_at]
      filter: {}
      allow_aggregations: true
      query_root_fields: [select, select_by_pk, select_aggregate]
      subscription_root_fields: [select, select_by_pk, select_aggregate]
insert_permissions:
  - role: user
    permission:
      check:
        id:
          _eq: X-Hasura-User-Id
      set:
        id: X-Hasura-User-Id
      columns: [id, username, display_name, avatar_url]
update_permissions:
  - role: user
    permission:
      columns: [username, display_name, avatar_url]
      filter:
        id:
          _eq: X-Hasura-User-Id
      check:
        id:
          _eq: X-Hasura-User-Id
