table:
  name: user_devices
  schema: public
object_relationships:
  - name: profile
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns: [user_id, push_token, platform, created_at]
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns: [user_id, push_token, platform]
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: user
    permission:
      columns: [platform, created_at]
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: admin
    permission:
      filter: {}
