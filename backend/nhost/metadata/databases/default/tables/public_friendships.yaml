table:
  name: friendships
  schema: public
object_relationships:
  - name: requester
    using:
      foreign_key_constraint_on: requester_id
  - name: addressee
    using:
      foreign_key_constraint_on: addressee_id
select_permissions:
  - role: user
    permission:
      columns: [id, requester_id, addressee_id, status, created_at, updated_at]
      filter:
        _or:
          - requester_id:
              _eq: X-Hasura-User-Id
          - addressee_id:
              _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - requester_id:
              _eq: X-Hasura-User-Id
          - status:
              _eq: pending
      set:
        requester_id: X-Hasura-User-Id
      columns: [requester_id, addressee_id, status]
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: user
    permission:
      columns: [status, updated_at]
      filter:
        _and:
          - addressee_id:
              _eq: X-Hasura-User-Id
          - status:
              _eq: pending
      check:
        status:
          _in: [accepted, rejected]
  - role: user
    permission:
      columns: [status, updated_at]
      filter:
        _and:
          - requester_id:
              _eq: X-Hasura-User-Id
          - status:
              _eq: pending
      check:
        status:
          _eq: cancelled
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
