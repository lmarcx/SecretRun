table:
  name: friendships
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: friend
    using:
      foreign_key_constraint_on: friend_user_id
select_permissions:
  - role: user
    permission:
      columns: [user_id, friend_user_id, created_at]
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - friend_user_id:
              _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns: [user_id, friend_user_id]
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - friend_user_id:
              _eq: X-Hasura-User-Id
  - role: admin
    permission:
      filter: {}
