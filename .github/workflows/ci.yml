name: CI

on:
  push:
    branches: [restart, main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (mobile)
        run: pnpm --filter @secret-run/mobile exec tsc -p tsconfig.json --noEmit

      - name: Typecheck (backend-api)
        run: pnpm --filter @secret-run/backend-api typecheck

      - name: Build web export
        run: NODE_ENV=production pnpm --filter @secret-run/mobile exec expo export --platform web --clear
